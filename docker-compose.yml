services:
  postgres:
    image: postgres:16-alpine
    container_name: vms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vms
      POSTGRES_PASSWORD: vms
      POSTGRES_DB: vendor_registration
    ports:
      - "5432:5432"
    volumes:
      - vms_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vms -d vendor_registration"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: vms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vms_redis:/data

volumes:
  vms_pg:
  vms_redis:
